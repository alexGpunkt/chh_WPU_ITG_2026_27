name: Projekt prüfen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
      - name: Node bereitstellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Projektstruktur prüfen
        run: node tools/validate-project.mjs
